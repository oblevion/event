<!DOCTYPE html>
<html>
<head>
  <title>Event Registration</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

<h2>Register for Event (₹5)</h2>

<input id="name" placeholder="Name"><br><br>
<input id="email" placeholder="Email"><br><br>
<input id="phone" placeholder="Phone"><br><br>

<button onclick="pay()">Pay Now</button>

<script>
async function pay() {
  const API_BASE = "https://event-608z.onrender.com";

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const phone = document.getElementById("phone").value;

  const res = await fetch(`${API_BASE}/api/payment/create-order`, {
    method: "POST",
  });

  const data = await res.json();

  console.log("Create order response:", data); // DEBUG

  const options = {
    key: data.key_id,                // ✅ FIX
    amount: data.order.amount,       // ✅ FIX
    currency: "INR",
    order_id: data.order.id,         // ✅ FIX
    name: "Event Registration",
    description: "Event Ticket ₹5",

    handler: async function (response) {
      await fetch(`${API_BASE}/api/payment/verify`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          razorpay_order_id: response.razorpay_order_id,
          razorpay_payment_id: response.razorpay_payment_id,
          razorpay_signature: response.razorpay_signature,
          name,
          email,
          phone,
        }),
      });

      window.location.href = "success.html";
    },
  };

  const rzp = new Razorpay(options);
  rzp.open();
}
</script>

</body>
</html>
