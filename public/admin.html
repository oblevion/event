<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
</head>
<body>

<h2>Registrations</h2>
<table border="1" id="table"></table>

<script>
fetch("https://event-production-8c4d.up.railway.app")
  .then(res => res.json())
  .then(data => {
    let html = `
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Payment ID</th>
      </tr>
    `;
    data.forEach(r => {
      html += `
        <tr>
          <td>${r.name}</td>
          <td>${r.email}</td>
          <td>${r.phone}</td>
          <td>${r.payment_id}</td>
        </tr>
      `;
    });
    document.getElementById('table').innerHTML = html;
  })
  .catch(err => {
    console.error(err);
    alert("Failed to load admin data");
  });
</script>

</body>
</html>
