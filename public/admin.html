<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
</head>
<body>

<h2>Registrations</h2>
<table border="1" id="table"></table>

<script>
const API_BASE = "https://event-608z.onrender.com";

fetch(`${API_BASE}/api/admin/registrations`)
  .then(res => res.json())
  .then(data => {
    let html = `
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Payment ID</th>
      </tr>
    `;

    data.forEach(r => {
      html += `
        <tr>
          <td>${r.name}</td>
          <td>${r.email}</td>
          <td>${r.phone}</td>
          <td>${r.payment_id}</td>
        </tr>
      `;
    });

    document.getElementById('table').innerHTML = html;
  });
</script>

</body>
</html>
